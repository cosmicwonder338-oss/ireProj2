# Default values. Every experiment YAML is deep-merged on top of this file.
# SI units here; the code nondimensionalizes with the `scales` block before training.
# NOTE: write floats as 1.0e+4 (PyYAML parses bare 1e4 as a string).

name: default            # results go to results/<name>/
seed: 1234
device: auto             # auto | cpu | cuda

physics:
  T_amb: 40.0            # °C
  h: 1.0e+4              # W/m²K, convective coefficient on 'convective' edges
  materials:             # thermal conductivity, W/mK
    silicon: 150.0
    copper: 400.0
    tim: 3.0
    void: 0.03           # air-filled void in the TIM (defect)
  cooling: backside      # backside: whole back face cooled -> sink h/t, all edges insulated (default,
                         #   chosen after Stage 1 — see results/notes.md)
                         # edge: convective edges per `boundary` (the original brief)
  thickness: 5.0e-4      # m, die thickness (backside sink h/t, and W totals)
  boundary:              # per edge: insulated | convective   (bottom = y=0); used by cooling=edge
    bottom: convective
    top: insulated
    left: insulated
    right: insulated

geometry:
  Lx: 0.01               # m (10 mm die)
  Ly: 0.01               # m

scales:                  # nondimensionalization
  L: 0.01                # m        x̂ = x / L
  k_ref: 150.0           # W/mK     k̂ = k / k_ref
  dT: 50.0               # K        T̂ = (T - T_amb) / dT

solver:                  # finite-volume grid (number of cells)
  nx: 200
  ny: 200

layouts:
  edge_width_mm: 0.15    # tanh smoothing of power-block edges (0 = sharp)
  target_peak_rise: 45.0 # K; power is scaled so max(T) - T_amb hits this

problem:
  layout: quad_core      # quad_core | cpu_gpu | random_hotspots

sensors:
  n: 15
  noise_rel: 0.01        # Gaussian noise std as a fraction of the max temperature rise
  placement: random      # random | grid | smart

model:
  hidden: 64
  layers: 4
  activation: tanh
  fourier:               # random Fourier input features (Stage 7); n = 0 disables
    n: 0
    sigma: 2.0

training:
  adam_iters: 10000
  adam_lr: 1.0e-3
  lr_final_ratio: 0.05   # exponential decay: lr ends at adam_lr * this
  lbfgs_iters: 2000
  lbfgs_chunk: 50        # L-BFGS iterations between logs / checkpoints
  n_collocation: 8192
  n_boundary: 512        # per edge
  resample_every: 500    # new random collocation points every N Adam steps (0 = fixed)
  log_every: 100
  eval_every: 500        # full-grid error vs reference
  snapshot_every: 250    # store predictions for the training GIF
  ckpt_every: 1000
  time_budget_min: 15.0  # hard wall-clock limit per run (both phases)
  resume: true           # continue from results/<name>/ckpt.pt if the config matches
  # --- improvements (Stage 7 ablation); defaults = vanilla PINN ---
  collocation: uniform   # uniform | rad (residual-based adaptive distribution)
  rad_pool_factor: 4     # candidate pool size = factor * n_collocation
  rad_k: 1.0             # sampling density ∝ |r|^k / mean + c
  rad_c: 1.0
  adaptive_weights: false  # gradient-statistics loss balancing (Wang et al. 2021)
  balance_every: 100

loss:
  w_pde: 1.0             # PDE residual (normalised by max(|q̂|, ŝ·T̂max))
  w_bc: 1.0              # boundary-condition residual
  data_weighting: noise  # noise: w_data = (sigma_pde / sigma_noise)^2 | fixed: use w_data
  sigma_pde: 0.01        # tolerated normalised PDE residual (sets the physics/data balance)
  sigma_floor_K: 0.1     # noise floor for noise-free data (K)
  w_data: 10.0           # only for data_weighting: fixed
